name: Evaluations

on:
  push:
    branches: [main]
    paths:
      - 'coprocessor/**'
      - 'evals/**'
      - 'core/**'
  pull_request:
    branches: [main]
    paths:
      - 'coprocessor/**'
      - 'evals/**'
      - 'core/**'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Evaluation suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - extraction
          - regression
          - policy
          - hallucination
          - gemini
          - pack-goldens

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ============================================================
  # STAGE 1: Fast deterministic checks (no API calls)
  # ============================================================

  hallucination-checks:
    name: "Hallucination Detection (Regex)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt
          pip install pytest

      - name: Run hallucination checks
        run: |
          python -m evals.runner --suite hallucination --zero-tolerance --verbose

  pack-golden-tests:
    name: "Pack Golden Tests (${{ matrix.pack }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pack: [treasury, wealth]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt

      - name: Run pack golden tests
        run: |
          python -m evals.runner --suite pack-goldens --pack ${{ matrix.pack }} --verbose

  extraction-evals:
    name: "Extraction Accuracy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt

      - name: Run extraction evals
        run: |
          python -m evals.runner --suite extraction --threshold 0.85 --verbose

  regression-evals:
    name: "Kernel Regression"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt

      - name: Run kernel regression
        run: |
          python -m evals.runner --suite regression --fail-on-drift --verbose

  policy-evals:
    name: "Policy Draft Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt

      - name: Run policy draft evals
        run: |
          python -m evals.runner --suite policy --verbose

  # ============================================================
  # STAGE 2: Gemini-powered semantic verification (requires API)
  # ============================================================

  gemini-verification:
    name: "Gemini Semantic Verification"
    runs-on: ubuntu-latest
    needs: [hallucination-checks, pack-golden-tests]
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt
          pip install google-genai

      - name: Run Gemini semantic verification
        run: |
          python -m evals.runner --suite gemini --verbose
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-verification-results
          path: |
            evals/results/*.json
          retention-days: 30

  # ============================================================
  # SUMMARY: Aggregate all results
  # ============================================================

  eval-summary:
    name: "Evaluation Summary"
    runs-on: ubuntu-latest
    needs: [hallucination-checks, pack-golden-tests, extraction-evals, regression-evals, policy-evals, gemini-verification]
    if: always()
    steps:
      - name: Check all results
        run: |
          echo "=== GOVERNANCE OS EVALUATION RESULTS ==="
          echo ""
          echo "Hallucination Checks: ${{ needs.hallucination-checks.result }}"
          echo "Pack Golden Tests: ${{ needs.pack-golden-tests.result }}"
          echo "Extraction Evals: ${{ needs.extraction-evals.result }}"
          echo "Regression Evals: ${{ needs.regression-evals.result }}"
          echo "Policy Evals: ${{ needs.policy-evals.result }}"
          echo "Gemini Verification: ${{ needs.gemini-verification.result }}"
          echo ""

          # Fail if any required job failed (gemini is optional if no API key)
          if [ "${{ needs.hallucination-checks.result }}" == "failure" ] || \
             [ "${{ needs.pack-golden-tests.result }}" == "failure" ] || \
             [ "${{ needs.extraction-evals.result }}" == "failure" ] || \
             [ "${{ needs.regression-evals.result }}" == "failure" ] || \
             [ "${{ needs.policy-evals.result }}" == "failure" ]; then
            echo "FAILED: One or more evaluation suites failed"
            exit 1
          fi

          echo "PASSED: All evaluation suites passed"

      - name: Create eval badge data
        if: success()
        run: |
          echo '{"schemaVersion":1,"label":"evals","message":"passing","color":"brightgreen"}' > badge.json

      - name: Upload badge data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eval-badge
          path: badge.json
          retention-days: 90

  # ============================================================
  # OPTIONAL: Generate adversarial test cases (manual trigger)
  # ============================================================

  generate-adversarial:
    name: "Generate Adversarial Cases"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt
          pip install google-genai

      - name: Generate adversarial test cases
        run: |
          mkdir -p evals/datasets/adversarial
          python -m evals.runner --generate-adversarial 10 --pack treasury \
            --adversarial-output evals/datasets/adversarial/treasury_adversarial.json
          python -m evals.runner --generate-adversarial 10 --pack wealth \
            --adversarial-output evals/datasets/adversarial/wealth_adversarial.json
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload adversarial cases
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-test-cases
          path: evals/datasets/adversarial/
          retention-days: 90
